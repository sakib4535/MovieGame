worker_processes auto;
events { worker_connections 2048; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  access_log off;
  sendfile on;
  keepalive_timeout 15;
  client_max_body_size 8k;
  client_body_timeout 5s;
  client_header_timeout 5s;
  gzip on;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/json image/svg+xml;
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
  proxy_cache_path /var/cache/nginx/moviegame levels=1:2 keys_zone=public_cache:10m max_size=100m inactive=10m;
  upstream api {
    zone api_pool 64k;
    least_conn;
    server api1:8000 max_fails=2 fail_timeout=10s;
    server api2:8000 max_fails=2 fail_timeout=10s;
    keepalive 32;
  }
  server {
    listen 80;
    root /srv/web;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://upload.wikimedia.org; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location = / { try_files /index.html =404; }
    location /assets/ { alias /srv/web/; expires 5m; }
    location = /metrics { return 404; }
    location = /health/live { proxy_pass http://api; proxy_cache off; }
    location = /health/ready { proxy_pass http://api; proxy_cache off; proxy_connect_timeout 2s; proxy_read_timeout 6s; }
    location / {
      limit_req zone=api_limit burst=40 nodelay;
      limit_req_status 429;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 2s;
      proxy_read_timeout 10s;
      proxy_send_timeout 5s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
      # GET/HEAD only. POST is never cached; retries retain the browser's idempotency key.
      proxy_cache public_cache;
      proxy_cache_methods GET HEAD;
      proxy_cache_key "$scheme$request_method$host$request_uri";
      proxy_cache_valid 200 30s;
      proxy_cache_bypass $http_authorization;
      proxy_no_cache $http_authorization;
      proxy_cache_lock on;
    }
  }
}

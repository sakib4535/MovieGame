name: moviegame
x-app: &app
  build: .
  image: moviegame:local
  restart: unless-stopped
  init: true
  environment: &environment
    APP_ENV: production
    DATABASE_URL: postgresql+psycopg://moviegame:${POSTGRES_PASSWORD:?Run setup.ps1 -Compose first}@db:5432/moviegame
    REDIS_URL: redis://redis:6379/0
    RATE_SECRET: ${RATE_SECRET:?Run setup.ps1 -Compose first}
    METRICS_TOKEN: ${METRICS_TOKEN:?Run setup.ps1 -Compose first}
    RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
    DB_POOL_SIZE: 10
    MAX_INFLIGHT: 64
  command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8000', --workers, '1', --limit-concurrency, '128', --timeout-keep-alive, '5', --timeout-graceful-shutdown, '30', --proxy-headers, --forwarded-allow-ips, '*', --no-access-log]
  # These containers have NO published port; only the trusted Nginx proxy can reach them from outside.
  expose: ['8000']
  mem_limit: 512m
  cpus: 1
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
    interval: 15s
    timeout: 6s
    retries: 3
    start_period: 20s
  depends_on:
    migrate: {condition: service_completed_successfully}
  logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: moviegame
      POSTGRES_DB: moviegame
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup.ps1 -Compose first}
    volumes: [pgdata:/var/lib/postgresql/data]
    command: [postgres, -c, max_connections=150, -c, shared_buffers=256MB]
    mem_limit: 1g
    healthcheck:
      test: [CMD-SHELL, pg_isready -U moviegame -d moviegame]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: [redis-server, --maxmemory, 64mb, --maxmemory-policy, noeviction, --save, '', --appendonly, 'no']
    mem_limit: 128m
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: .
    image: moviegame:local
    environment: *environment
    command: [python, -m, app.manage, init]
    restart: 'no'
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  api1: *app
  api2: *app
  edge:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ['127.0.0.1:8080:80']
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web:/srv/web:ro
    depends_on:
      api1: {condition: service_healthy}
      api2: {condition: service_healthy}
    mem_limit: 128m
  cleanup:
    build: .
    image: moviegame:local
    environment: *environment
    command: [sh, -c, 'while true; do python -m app.manage prune; sleep 3600; done']
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
    mem_limit: 128m
volumes:
  pgdata:
